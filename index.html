<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 25%27%3E%3Crect x=%271%27 y=%271%27 width=%2718%27 height=%2723%27 rx=%272.5%27 fill=%27%23050505%27/%3E%3Crect x=%2713%27 y=%271%27 width=%273%27 height=%2723%27 fill=%27%23f3c623%27/%3E%3C/svg%3E">
<title>BLACKBOOK — Setup Book</title>
<script>try{var t=localStorage.getItem("bb-theme");if(t==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
:root{
  --bg:#0a1018;--panel:#111a24;--panel2:#18232f;--line:#243444;--ink:#e4edf5;--mute:#8b9db0;
  --acc:#3ccfee;--acc-ink:#03141b;--acc-edge:#1ba3c2;--blue:#3a78d4;--red:#ff5f63;--dro:#82efff;--dro-bg:#04090e;--dro-edge:#1b2a38;--dro-glow:rgba(130,239,255,.2);
  --grid:rgba(140,190,235,.035);--hdr:rgba(10,16,24,.94);--navbg:#060b11;--field:#09111a;--deep:#060b11;--hollow:#33455a;--link:#7cc4ff;
  --info-bg:#0f2238;--info-edge:#234469;--info-ink:#a9d2ff;--bad-bg:#2a1319;--bad-edge:#5c2631;--bad-ink:#ffb3b6;
  --haz:#f4c542;--haz-bg:#1b1910;--haz-edge:#5b4b14;--ver-bg:#0c2230;--ver-edge:#1d6b82;--ver-ink:#cbe5ef;
  --tag:#c5d3e0;--tag-ink:#13202c;--tag-dark:#0a141d;--tag-mute:#4b5f72;--tag-hole:#97abbe;--tag-line:rgba(20,45,70,.08);
  --tile-on:#0d2834;--st-off:#223140;--st-on:#1f97b3;--stale:#66778a;--ok-edge:#2c6b58;--soft:#c2cfdb;--shade:rgba(0,0,0,.72);--rec:#8f2a2a;--rec-edge:#b83a3a;--chip-edge:#5a93e6;--chip-ink:#e0ecff;--dash:#4a5b6d;
  --mono:ui-monospace,"SF Mono","Roboto Mono","Cascadia Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --cond:"Avenir Next Condensed","sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme=light]{
  --bg:#edf2f6;--panel:#ffffff;--panel2:#e3eaf0;--line:#c7d3dd;--ink:#0d1923;--mute:#56687a;
  --acc:#0a8fb4;--acc-ink:#ffffff;--acc-edge:#07718f;--blue:#2462c8;--red:#d23439;--dro:#00687d;--dro-bg:#eaf7fb;--dro-edge:#b4d9e4;--dro-glow:transparent;
  --grid:rgba(20,60,100,.05);--hdr:rgba(237,242,246,.94);--navbg:#ffffff;--field:#ffffff;--deep:#dbe4ec;--hollow:#9aabbb;--link:#1c62c3;
  --info-bg:#e5effb;--info-edge:#b5cdee;--info-ink:#1d4c8a;--bad-bg:#fdeceb;--bad-edge:#eeb6b6;--bad-ink:#a1252b;
  --haz:#e8b21c;--haz-bg:#fff7de;--haz-edge:#e2c35a;--ver-bg:#e7f5f9;--ver-edge:#79c1d4;--ver-ink:#1f3d49;
  --tag:#d8e3ec;--tag-ink:#13202c;--tag-dark:#0a141d;--tag-mute:#4b5f72;--tag-hole:#a2b4c5;--tag-line:rgba(20,45,70,.07);
  --tile-on:#dcf1f8;--st-off:#d0dae3;--st-on:#0a8fb4;--stale:#9aa6b1;--ok-edge:#7dbd9f;--soft:#384856;--shade:rgba(8,18,28,.55);--rec:#c23636;--rec-edge:#a02b2b;--chip-edge:#2462c8;--chip-ink:#ffffff;--dash:#9fb0bf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app.wizmode{padding-bottom:0}
#app.wizmode #top{display:none}
header#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--hdr)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.brand b{font-family:var(--cond);font-weight:800;letter-spacing:.2em;font-size:21px}
.brand small{color:var(--mute);font:600 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:none;border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tape{height:5px;background:var(--acc);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 60px,rgba(0,0,0,.08) 60px 62px)}
/*bn*/.bn{margin:10px 14px 0;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid var(--info-edge)}
.bn.bad{background:var(--bad-bg);border-color:var(--bad-edge)}
.bn p{flex:1}
.bn > button{background:none;border:0;color:var(--mute);font-size:18px;min-width:28px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:720px;margin:0 auto;background:var(--navbg);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
#nav[hidden]{display:none}
#nav button{background:none;border:0;color:var(--mute);font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:54px;justify-content:center}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
#nav button.on{color:var(--ink)}
#nav button.on svg{stroke:var(--acc)}
#nav .fab{width:64px;height:64px;border-radius:16px;background:var(--acc);color:var(--acc-ink);margin:-24px auto 2px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.22);font:800 11px var(--cond)}
#nav .fab svg{stroke:var(--acc-ink);stroke-width:2.6;width:26px;height:26px}

/* type + layout */
.sec{margin:22px 14px 8px;font:800 13px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.sec .cnt{color:var(--ink)}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.pad{padding:0 14px}
.muted{color:var(--mute)}
.mono{font-family:var(--mono)!important;letter-spacing:.02em}
.backbar{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.backbar span{font:700 13px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:800 15px var(--cond);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;text-align:center}
.btn.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc-edge)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--bad-edge);background:transparent}
.btn.rec{color:#fff;background:var(--rec);border-color:var(--rec-edge)}
.btn.sm{min-height:42px;padding:0 12px;font-size:13px}
.btn.wide{width:100%;margin-top:8px}
.btn:disabled{opacity:.35}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px}
.btns .btn{flex:1 1 40%}
.link{background:none;border:0;color:var(--link);font-weight:600;padding:8px 0;text-align:left}

/* inputs */
input,textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:16px/1.35 var(--body);padding:12px;letter-spacing:normal;text-transform:none}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
input.big{font-size:22px;padding:14px}
input.up{text-transform:uppercase}
input.huge{font-size:34px;font-weight:700;text-align:center;padding:8px}
.fl{display:block;font:800 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 0}
.fl>input,.fl>textarea,.fl>select{margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.check input{width:24px;height:24px;flex:none;accent-color:var(--acc);margin-top:1px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:0 14px;margin:10px 0 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:8px 13px;font:600 14px var(--body);min-height:40px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--chip-edge)}
.chip small{color:var(--mute);margin-left:4px}
.chip.on small{color:var(--chip-ink)}

/* search */
.searchwrap{padding:14px 14px 4px;position:relative}
.searchwrap input{font:700 20px var(--mono);padding:16px 48px 16px 46px;border-radius:12px;border:2px solid var(--line);background:var(--field)}
.searchwrap svg{position:absolute;left:28px;top:31px;width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2;pointer-events:none}
.searchwrap .clr{position:absolute;right:22px;top:24px;width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:22px}
.reshead{display:flex;justify-content:space-between;align-items:center;margin:10px 14px 0;font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* DRO readouts */
.ro{background:var(--dro-bg);border:1px solid var(--dro-edge);border-radius:8px;padding:7px 10px 8px;min-width:0}
.ro span{display:block;font:800 10px var(--cond);letter-spacing:.18em;color:var(--mute)}
.ro b{display:block;font:700 22px/1.15 var(--mono);color:var(--dro);text-shadow:0 0 10px var(--dro-glow);overflow-wrap:anywhere}
.ro b i{color:var(--hollow);font-style:normal;text-shadow:none}
.dro{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:14px}
.dro .ro b{font-size:26px}
.ro.lk span::after{content:' ◆';color:var(--acc)}

/* setup rows */
.srow{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px;margin:10px 14px}
.srow.ok{border-left-color:var(--acc)}
.srow.stale{border-left-color:var(--red)}
.srow-h{display:flex;align-items:center;gap:8px}
.pn{font:700 20px var(--mono);letter-spacing:.02em;overflow-wrap:anywhere}
.rev{flex:none;font:800 11px var(--cond);letter-spacing:.12em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--mute)}
.srow-op{color:var(--mute);font-size:14px;margin:2px 0 9px}
.srow-op em{font-style:normal;color:var(--link)}
.srow-ro{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.srow .ro b{font-size:16px}
.mini{margin-left:auto;flex:none;width:30px;height:30px;border:2px solid var(--acc);border-radius:50%;color:var(--acc);display:grid;place-items:center;font:800 11px var(--cond);transform:rotate(-12deg)}
.mini.stale{border-color:var(--red);color:var(--red)}
.notin{margin:12px 14px;padding:14px;border:2px dashed var(--dash);border-radius:12px;display:flex;align-items:center;gap:12px}
.notin div{flex:1}
.notin b{font-family:var(--mono);font-size:18px}

/* setup detail */
.shead{position:relative;padding:12px 14px 0;min-height:118px}
.pnxl{font:800 30px/1.1 var(--mono);letter-spacing:.01em;padding-right:112px;overflow-wrap:anywhere}
.shead .sub{display:flex;gap:8px;align-items:center;margin-top:6px;padding-right:112px;font-size:17px}
.shead .sub2{color:var(--mute);margin-top:4px;padding-right:112px;font-size:14px}
.stampslot{position:absolute;right:8px;top:4px}
.warn{color:var(--bad-ink)}
.toolref{margin:-6px 14px 0;display:flex;flex-wrap:wrap;gap:6px}
.toolref a{font:700 12px var(--mono);color:var(--tag-ink);background:var(--tag);border-radius:4px;padding:4px 8px;text-decoration:none}
.kvt{margin:0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kvt div{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-top:1px solid var(--line);background:var(--panel)}
.kvt div:first-child{border-top:0}
.kvt span{color:var(--mute)}
.kvt b{font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
ol.steps{margin:0 14px;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:11px 12px 11px 50px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;white-space:pre-wrap}
ol.steps li::before{content:counter(s);position:absolute;left:11px;top:9px;width:27px;height:27px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font:700 14px var(--mono);color:#fff}
.haz{margin:14px;border:1px solid var(--haz-edge);border-radius:10px;overflow:hidden;background:var(--haz-bg)}
.haz::before{content:'';display:block;height:10px;background:repeating-linear-gradient(-45deg,var(--haz) 0 10px,#111 10px 20px)}
.haz h4{font:800 13px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);padding:10px 12px 0}
.haz p{padding:6px 12px 12px;white-space:pre-wrap}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0 14px}
.ph{position:relative;min-width:0}
.ph-img{aspect-ratio:1/1;background:#000 center/cover no-repeat;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.ph figcaption{font:700 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:5px 2px}
.ph select{margin-top:6px;padding:8px;font-size:14px}
.ph .x{position:absolute;top:6px;right:6px;background:var(--shade)}
.aud{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 8px}
.aud audio{width:100%;height:40px}
.aud-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px}
.aud-meta span{flex:1}
.aud-meta small{color:var(--mute);font-family:var(--mono)}
.auds{margin:0 14px}
.gaprow{margin:10px 14px}
.gap{display:inline-block;font:800 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--bad-ink);border:1px solid var(--bad-edge);background:var(--bad-bg);border-radius:4px;padding:4px 8px;margin:2px 2px 2px 0}
.okline{margin:10px 14px;color:var(--dro);font:800 13px var(--cond);letter-spacing:.14em;text-transform:uppercase}
.meta{margin:18px 14px;color:var(--mute);font-size:13px;line-height:1.6}
.verify{margin:14px;padding:14px;border:1px dashed var(--ver-edge);border-radius:12px;background:var(--ver-bg)}
.verify p{font-size:14px;color:var(--ver-ink);margin-bottom:10px}

/* stamp */
.stamp{width:108px;height:108px;color:var(--acc);transform:rotate(-9deg);opacity:.95;display:block}
.stampwrap{position:relative;display:inline-block}
.stampwrap.stale .stamp{color:var(--stale)}
.stampwrap .void{position:absolute;left:-8px;right:-8px;top:42%;transform:rotate(-18deg);background:var(--red);color:#fff;font:800 12px var(--cond);letter-spacing:.14em;text-align:center;padding:3px 0}

/* wizard */
.wiz{min-height:100vh;display:flex;flex-direction:column}
.wiz-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.wiz-title{flex:1;font:800 18px var(--cond);letter-spacing:.1em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-n{font:700 14px var(--mono);color:var(--mute)}
.strip{display:flex;gap:4px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;border-top:4px solid var(--st-off);color:var(--mute);font:800 10px var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:7px 1px;min-height:36px}
.st.done{border-top-color:var(--st-on)}
.st.on{border-top-color:var(--acc);color:var(--ink)}
.wiz-body{flex:1;padding:8px 14px 130px}
.wiz-body h2{font:800 24px var(--cond);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 2px}
.wiz-bar{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--navbg);border-top:1px solid var(--line);z-index:30}
.wiz-bar .btn.go{flex:2}
.wiz-bar .btn.ghost{flex:1}
.slot{margin:16px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.slot-h{font:800 13px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.slot-h.hz{color:var(--acc);margin-top:20px}
.linked{margin-top:8px;font-size:14px;color:var(--link);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linked .x{min-height:32px;padding:0 10px;min-width:0;font-size:13px}
.kv{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:6px}
.x{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;min-width:40px;min-height:40px;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:3px;min-height:132px}
.tile.on{border-color:var(--acc);background:var(--tile-on)}
.tile b{font-size:16px}
.tile small{color:var(--mute)}
.tile-ph{height:76px;border-radius:8px;background:var(--deep) center/cover no-repeat;display:grid;place-items:center;color:var(--hollow);margin-bottom:4px}
.tile.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mute);font:800 15px var(--cond);letter-spacing:.1em;text-transform:uppercase}
.psi{display:flex;align-items:center;gap:8px}
.psi .btn{min-width:64px;padding:0}
.psi .unit{font:800 14px var(--cond);letter-spacing:.14em;color:var(--mute)}
.steps-ed{list-style:none;counter-reset:e}
.steps-ed li{counter-increment:e;display:grid;grid-template-columns:30px 1fr;gap:8px;margin-bottom:8px}
.steps-ed li::before{content:counter(e);width:28px;height:28px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font:700 13px var(--mono);margin-top:10px;color:#fff}
.mv{grid-column:2;display:flex;gap:6px;justify-content:flex-end}
.mv button{min-height:34px;min-width:44px}
.recrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.recrow .btn,.recrow label.btn{flex:1}
.phadd{display:flex;gap:8px;margin-top:12px}
.phadd .btn{flex:1}
.review{margin:10px 0}
.review .pn{font-size:26px}
.review .dro{margin:12px 0}
.dup{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--info-bg);border:1px solid var(--info-edge);font-size:14px}

/* machines */
.mrow{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 14px}
.mrow .tile-ph{width:76px;height:76px;flex:none;margin:0}
.mrow b{display:block;font-size:17px}
.mrow small{color:var(--mute);display:block}
.mrow .nums{margin-left:auto;text-align:right;font:700 13px var(--mono);color:var(--mute);flex:none}
.mrow .nums b{font-size:22px;color:var(--ink)}
.mhero{height:190px;margin:12px 14px 0;border-radius:12px;background:var(--deep) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--hollow);position:relative;overflow:hidden}
.mhero label{position:absolute;right:10px;bottom:10px}
.mtitle{margin:12px 14px 0}
.mtitle h2{font:800 26px var(--cond);letter-spacing:.04em}
.mtitle p{color:var(--mute)}
.badge{display:inline-block;font:800 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--info-edge);background:var(--info-bg);color:var(--info-ink);border-radius:4px;padding:3px 7px;margin:6px 4px 0 0}
.qa{margin:10px 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px}
.qa.done{border-left-color:var(--dro)}
.qa .q{font-weight:700;margin-bottom:8px}
.qa .aud{margin-top:8px;background:var(--panel2)}
.qaadd{display:flex;gap:8px;margin:10px 14px}
.qaadd .btn{flex:none}

/* crib tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 14px}
.tag{position:relative;display:block;text-decoration:none;color:var(--tag-ink);background:var(--tag);padding:30px 12px 12px;min-height:150px;
  clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%,0 20px);
  background-image:linear-gradient(var(--tag-line) 1px,transparent 1px);background-size:100% 19px;background-position:0 8px}
.tag::before{content:'';position:absolute;top:9px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--tag-hole)}
.tag .code{font:800 21px/1.1 var(--mono);color:var(--tag-dark);overflow-wrap:anywhere}
.tag .nm{font-size:13px;margin-top:4px}
.tag .sz{font:700 13px var(--mono);margin-top:4px}
.tag .loc{font:800 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--tag-mute);margin-top:8px}
.tag .use{position:absolute;top:6px;right:22px;font:800 11px var(--mono);color:var(--tag-mute)}
.tag.big{margin:12px 14px;min-height:0;padding:34px 18px 18px}
.tag.big .code{font-size:32px}
.tagph{height:120px;margin:0 14px;border-radius:10px;background:var(--deep) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}

/* gaps */
.meter{margin:14px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.meter .big{font:800 46px/1 var(--mono)}
.meter .big small{font-size:18px;color:var(--mute)}
.meter p{color:var(--mute);margin-top:4px}
.bar{height:14px;border-radius:7px;background:var(--field);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,var(--acc-edge) 8px 16px)}
.pnchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 14px}
.pnchip{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--dash);border-radius:8px;padding:6px 6px 6px 10px;font:700 14px var(--mono);background:var(--panel)}
.pnchip button{border:0;background:var(--acc);color:var(--acc-ink);border-radius:6px;font:800 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;min-height:32px;padding:0 10px}
.pnchip.done{border-style:solid;border-color:var(--ok-edge);color:var(--dro)}
.mq{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit;margin:8px 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mq b{font:700 16px var(--mono);color:var(--acc)}

/* empty */
.empty{margin:18px 14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.empty h2{font:800 26px/1.1 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.empty ol{margin:12px 0 4px 20px;color:var(--soft)}
.empty li{margin:6px 0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.mbox{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--panel);border-top:4px solid var(--acc);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.mbox h3{font:800 21px var(--cond);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mbox p{color:var(--soft)}
.mbar{display:flex;gap:10px;margin-top:18px}
.mbar .btn{flex:1}
.viewer{background:#000;padding:10px;border-top-color:#000}
.viewer img{display:block;max-width:100%;max-height:74vh;margin:0 auto;border-radius:6px}
.viewer p{text-align:center;color:var(--mute);margin-top:8px;font:700 13px var(--cond);letter-spacing:.1em;text-transform:uppercase}
.recbox{text-align:center}
.recdot{width:22px;height:22px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1s infinite;vertical-align:middle;margin-right:10px}
@keyframes pulse{50%{opacity:.25}}
.rectime{font:800 54px var(--mono);margin:14px 0}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;transition:.25s;background:var(--panel2);border:1px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;pointer-events:none;max-width:90vw;text-align:center;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.setrow{margin:0 14px}
.small{font-size:13px}

/* print */
#print{display:none}
@page{size:letter;margin:.4in}
details.talk{margin:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px}
details.talk summary{font:800 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:12px 0;cursor:pointer}
.talk-l .tl{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.talk-l .tl small{font:700 12px var(--mono);color:var(--mute);min-width:38px;padding-top:2px}
.talk-l .tl span{flex:1 1 200px}
.talk-l .tb{display:flex;gap:6px;flex:0 0 auto!important}
.vidbtn{display:flex;align-items:center;justify-content:center;gap:8px}
#vprog .bar{margin-top:8px}
@media print{
  body{background:#fff!important;color:#000}
  #app,#modal,#toast{display:none!important}
  #print{display:block}
  .psheet{font:11pt/1.35 Arial,Helvetica,sans-serif;color:#000;page-break-after:always;break-after:page;position:relative}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  .ptop{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #000;padding-bottom:8px}
  .ppn{font:bold 26pt/1.05 "Courier New",monospace}
  .psub{font-size:12pt;margin-top:4px}
  .pbrand{font:bold 9pt Arial;letter-spacing:.2em;color:#555;text-align:right}
  .pro{display:flex;gap:8px;margin:12px 0}
  .pro div{flex:1;border:2px solid #000;padding:6px 8px}
  .pro span{display:block;font:bold 8pt Arial;letter-spacing:.15em;color:#444}
  .pro b{font:bold 18pt "Courier New",monospace}
  .ptab{width:100%;border-collapse:collapse;margin:6px 0 10px}
  .ptab td{border:1px solid #999;padding:4px 6px;vertical-align:top}
  .ptab td:first-child{width:38%;color:#333}
  .ptab td:last-child{font-family:"Courier New",monospace;font-weight:bold}
  .ph4{font:bold 9pt Arial;letter-spacing:.15em;text-transform:uppercase;margin:10px 0 4px;color:#333}
  .psteps{margin-left:20px}
  .psteps li{margin:2px 0;white-space:pre-wrap}
  .pwatch{border-left:8px solid #000;padding:6px 10px;background:#f2f2f2;white-space:pre-wrap}
  .pphotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .pphotos figure{width:2.35in}
  .pphotos img{width:2.35in;height:1.8in;object-fit:cover;border:1px solid #999}
  .pphotos figcaption{font-size:8pt;color:#444}
  .pfoot{margin-top:12px;border-top:1px solid #999;padding-top:4px;font-size:8pt;color:#555}
  .pstamp .stamp{color:#1f3f9a;width:1.1in;height:1.1in}
  .pstamp .stampwrap.stale .stamp{color:#999}
}
</style>

<body>
<div id="app">
  <header id="top">
    <div class="brand" data-act="home">
      <svg width="20" height="25" viewBox="0 0 20 25" aria-hidden="true"><rect x="1" y="1" width="18" height="23" rx="2.5" style="fill:var(--dro-bg);stroke:var(--hollow)"/><rect x="13" y="1" width="3" height="23" style="fill:var(--acc)"/></svg>
      <b>BLACKBOOK</b><small id="shopName"></small>
    </div>
    <div style="display:flex;gap:8px"><button class="icon" id="themeBtn" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><button class="icon" data-act="nav" data-to="#more" aria-label="Backup and settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button></div>
  </header>
  <div class="tape"></div>
  <div id="banner"></div>
  <main id="view"></main>
  <nav id="nav">
    <button data-act="nav" data-to="#" data-v=""><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2l5.3 5.3"/></svg>Lookup</button>
    <button data-act="nav" data-to="#machines" data-v="machines"><svg viewBox="0 0 24 24"><path d="M5 3h12v5h-3.5V6.2H8.5v11.6h5v-1.9H17V21H5z"/><path d="M15.2 8.2v2.6M15.2 13.2v2.6"/></svg>Machines</button>
    <button class="fab" data-act="newSetup" aria-label="Capture a setup"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>Capture</button>
    <button data-act="nav" data-to="#crib" data-v="crib"><svg viewBox="0 0 24 24"><path d="M3.5 11.5V4h7.5l9.5 9.5-7.5 7.5z"/><circle cx="7.8" cy="8.3" r="1.5"/></svg>Crib</button>
    <button data-act="nav" data-to="#gaps" data-v="gaps"><svg viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v5M12 17.6v.4"/></svg>Gaps</button>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<div id="print"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const normPN=s=>String(s||'').toUpperCase().replace(/[\s\-_.\/]/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const initials=n=>String(n||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'OK';
const fmtDur=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtDate=t=>{if(!t)return '';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2)};
function ago(t){if(!t)return 'never';const s=(now()-t)/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' days ago'}
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v}
function upsert(arr,r){const i=arr.findIndex(x=>x.id===r.id);if(i<0)arr.push(r);else arr[i]=r}
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();

const OPS=['Dimple','Rivet','Punch','Flare','Countersink','Form','Trim','Press in'];
const MATS=['2024-T3','7075-T6','6061-T6','Ti 6Al-4V','321 SS','Inconel 625'];
const CAPS=['Overall setup','Upper tool','Lower tool','Part loaded','Good part','Bad part','Gauge / check','Other'];
const MTYPES=['Pneumatic C-frame press','Rivet squeezer','Dimpler','Arbor press','Punch / notcher','Press brake','Roll','Hydroform','Other'];
const TKINDS=['Upper','Lower','Punch','Die','Rivet set','Anvil','Pin / locator','Shim','Gauge','Other'];
const EXTRA_Q=['Shims','Locator pin','Stripper','Spacer','Backup bar','Fixture'];
const SET_Q=['Stop / fence','Stroke / depth','Shut height','Dwell','Hits per hole','Fastener','Part orientation','Lube'];
const STEPS=['Part','Machine','Tooling','Settings','How-to','Photos','Review'];
function leads(){return String(S.settings.expert||'').split(',').map(x=>x.trim()).filter(Boolean)}
function addLead(n){n=String(n||'').trim();if(!n)return;const l=leads();if(!l.some(x=>x.toLowerCase()===n.toLowerCase())){l.push(n);S.settings.expert=l.join(', ');saveSettings()}}
function leadList(){return `<datalist id="leadDL">${leads().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}
function seedQA(air){
  const q=['What do you check first, before running anything on this machine?',
    air?'How do you know the air pressure is right? What happens if it is off?':null,
    'What goes wrong most often, and how do you fix it?',
    'Which parts are tricky on this machine, and why?',
    'How do you change the tooling? Any tricks to it?',
    'What should nobody ever do on this machine?',
    'Where are the tools, shims and spare parts kept?'].filter(Boolean);
  return q.map(x=>({id:uid('q'),q:x,a:'',audio:[]}));
}
const ICON_C='<svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M10 6h25v10h-7v-4H17v24h11v-4h7v10H10z"/><path d="M31.5 16v6M31.5 32v-6"/></svg>';

/* ============ storage ============ */
const STORES=['machines','tools','setups','blobs','meta'];
const Store={
  mode:'idb',db:null,mem:{},
  async init(){
    try{
      if(!window.indexedDB)throw new Error('no idb');
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('blackbook',1);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
        setTimeout(()=>rej(new Error('timeout')),5000);
      });
      await this.all('meta');
    }catch(e){this.mode='mem';STORES.forEach(s=>this.mem[s]=new Map())}
  },
  _req(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(s){return this.mode==='mem'?Promise.resolve([...this.mem[s].values()]):this._req(s,'readonly',o=>o.getAll())},
  get(s,id){return this.mode==='mem'?Promise.resolve(this.mem[s].get(id)):this._req(s,'readonly',o=>o.get(id))},
  put(s,v){if(this.mode==='mem'){this.mem[s].set(v.id,v);return Promise.resolve()}return this._req(s,'readwrite',o=>o.put(v))},
  del(s,id){if(!id)return Promise.resolve();if(this.mode==='mem'){this.mem[s].delete(id);return Promise.resolve()}return this._req(s,'readwrite',o=>o.delete(id))},
  clear(s){if(this.mode==='mem'){this.mem[s].clear();return Promise.resolve()}return this._req(s,'readwrite',o=>o.clear())}
};

/* ============ state ============ */
const S={machines:[],tools:[],setups:[],settings:{shop:'',me:'',expert:'',lastBackup:0},targets:[],draft:null,q:'',mf:'',route:{v:'',id:''},depth:0,lastHash:null};
async function loadAll(){
  for(const k of ['machines','tools','setups'])S[k]=await Store.all(k);
  const st=await Store.get('meta','settings');if(st)S.settings={...S.settings,...st.data};
  const tg=await Store.get('meta','targets');if(tg)S.targets=tg.data||[];
  const dr=await Store.get('meta','draft');if(dr)S.draft=dr.data;
}
const timers={};
function soon(key,fn,ms=400){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
const saveSettings=()=>soon('settings',()=>Store.put('meta',{id:'settings',data:S.settings}));
const saveTargets=()=>Store.put('meta',{id:'targets',data:S.targets});
const saveDraft=()=>soon('draft',()=>S.draft?Store.put('meta',{id:'draft',data:S.draft}):Store.del('meta','draft'),300);
const saveMachineSoon=m=>soon('m'+m.id,()=>Store.put('machines',m),500);

const machineById=id=>S.machines.find(m=>m.id===id);
const toolById=id=>S.tools.find(t=>t.id===id);
const setupById=id=>S.setups.find(s=>s.id===id);
const setupsOn=mid=>S.setups.filter(s=>s.machineId===mid);
const toolUses=tid=>S.setups.filter(s=>s.upper.toolId===tid||s.lower.toolId===tid);
const toolLabel=t=>t?(t.code||t.size||t.name||'tool'):'';
const showsPsi=s=>{const m=machineById(s.machineId);return (m?m.usesAir!==false:true)||!!String(s.psi||'').trim()};
function stampState(s){if(!s.verified)return 'none';return s.verified.at<s.updated?'stale':'ok'}
function setupGaps(s,stampNow){
  const g=[],m=machineById(s.machineId);
  if(!m)g.push('No machine');
  if(!String(s.upper.size).trim()&&!String(s.lower.size).trim())g.push('No tool sizes');
  if(m&&m.usesAir!==false&&!String(s.psi||'').trim())g.push('No PSI');
  if(!s.steps.filter(x=>x.trim()).length&&!String(s.watch||'').trim()&&!s.audio.length)g.push('No how-to');
  if(!s.photos.length)g.push('No photos');
  if(!stampNow){const st=stampState(s);if(st==='none')g.push('Not verified');if(st==='stale')g.push('Changed after stamp')}
  return g;
}
function blankSetup(pn=''){return{id:uid('s'),pn,rev:'',op:'',material:'',thk:'',machineId:'',upper:{toolId:'',size:''},lower:{toolId:'',size:''},extraTools:[],psi:'',settings:[],steps:[],watch:'',photos:[],audio:[],by:S.settings.me||'',verified:null,created:0,updated:0}}
const snapshot=s=>JSON.stringify({...s,updated:0,created:0,verified:0});

/* ============ blobs ============ */
const urlCache=new Map();
async function saveBlob(blob){const id=uid('b');await Store.put('blobs',{id,type:blob.type,blob,created:now()});urlCache.set(id,URL.createObjectURL(blob));return id}
async function delBlob(id){if(!id)return;await Store.del('blobs',id);if(urlCache.has(id)){URL.revokeObjectURL(urlCache.get(id));urlCache.delete(id)}}
async function blobURL(id){if(urlCache.has(id))return urlCache.get(id);const r=await Store.get('blobs',id);if(!r||!r.blob)return '';const u=URL.createObjectURL(r.blob);urlCache.set(id,u);return u}
async function hydrate(root){for(const el of $$('[data-blob]',root)){const u=await blobURL(el.dataset.blob);if(!u)continue;if(el.tagName==='IMG'||el.tagName==='AUDIO')el.src=u;else el.style.backgroundImage=`url("${u}")`}}
async function compressImage(file,max=1500,q=0.8){
  let img;
  try{img=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  }
  const w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q));
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b)});
function b64ToBlob(b64,type){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||'application/octet-stream'})}

/* ============ UI bits ============ */
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(timers.toast);timers.toast=setTimeout(()=>t.classList.remove('show'),ms)}
let confirmRes=null,modalLock=false;
function openModal(html,cls=''){const m=$('#modal');m.innerHTML=`<div class="mbox ${cls}">${html}</div>`;m.hidden=false;hydrate(m)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';modalLock=false;if(confirmRes){const r=confirmRes;confirmRes=null;r(false)}}
function ask(msgHtml,ok='OK',danger=false){return new Promise(r=>{openModal(`<p style="font-size:17px">${msgHtml}</p><div class="mbar"><button class="btn ghost" data-act="cNo">Cancel</button><button class="btn ${danger?'danger':'go'}" data-act="cYes">${esc(ok)}</button></div>`);confirmRes=r})}
function choose(msgHtml,opts){return new Promise(r=>{openModal(`<p style="font-size:17px">${msgHtml}</p><div class="mbar" style="flex-direction:column">${opts.map((o,i)=>`<button class="btn ${o.cls||''}" data-act="cPick" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`);S.chooseOpts=opts;confirmRes=v=>r(v===false?null:v)})}
const ro=(label,val,cls='')=>`<div class="ro ${cls}"><span>${esc(label)}</span><b>${String(val??'').trim()?esc(val):'<i>—</i>'}</b></div>`;

/* ============ router ============ */
function go(h){if(h==='#')h='';if(location.hash.replace(/^#/,'')===h.replace(/^#/,''))render();else location.hash=h}
function swap(h){if(h==='#')h='';const u=location.href.split('#')[0]+(h?(h[0]==='#'?h:'#'+h):'#');if(location.href===u)render();else location.replace(u)}
S.stack=[location.hash];
window.addEventListener('hashchange',()=>{const h=location.hash,st=S.stack;if(st.length>1&&st[st.length-2]===h)st.pop();else st.push(h);render()});
const PARENT={setup:'#',machine:'#machines',tool:'#crib',more:'#'};
function render(){
  const h=location.hash.replace(/^#/,''),i=h.indexOf('-');
  const v=i<0?h:h.slice(0,i),id=i<0?'':h.slice(i+1);
  S.route={v,id};
  if(v==='edit'&&!S.draft){swap('#');return}
  let html;
  switch(v){
    case 'setup':html=vSetup(id);break;
    case 'edit':html=vWizard();break;
    case 'machines':html=vMachines();break;
    case 'machine':html=vMachine(id);break;
    case 'crib':html=vCrib();break;
    case 'tool':html=vTool(id);break;
    case 'gaps':html=vGaps();break;
    case 'more':html=vMore();break;
    default:html=vLookup();
  }
  $('#view').innerHTML=html;
  $('#app').classList.toggle('wizmode',v==='edit');
  $('#nav').hidden=v==='edit';
  const navV=v==='setup'?'':v==='machine'?'machines':v==='tool'?'crib':v;
  $$('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===navV));
  if(S.lastHash!==location.hash){window.scrollTo(0,0);S.lastHash=location.hash}
  hydrate($('#view'));
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}

/* ============ views: lookup ============ */
function search(q,mf){
  const nq=normPN(q),lq=q.trim().toLowerCase();
  const list=S.setups.filter(s=>!mf||s.machineId===mf);
  if(!lq)return list.sort((a,b)=>b.updated-a.updated);
  const out=[];
  for(const s of list){
    const pn=normPN(s.pn);let sc=0;
    if(nq&&pn===nq)sc=100;else if(nq&&pn.startsWith(nq))sc=80;else if(nq&&pn.includes(nq))sc=60;
    else{const m=machineById(s.machineId);
      const hay=[s.op,s.material,s.upper.size,s.lower.size,m&&m.name,toolLabel(toolById(s.upper.toolId)),toolLabel(toolById(s.lower.toolId)),...s.extraTools.map(r=>r.value),...s.settings.map(r=>r.value)].join(' ').toLowerCase();
      if(hay.includes(lq))sc=30}
    if(sc)out.push([sc,s]);
  }
  return out.sort((a,b)=>b[0]-a[0]||b[1].updated-a[1].updated).map(x=>x[1]);
}
function resultsHTML(){
  const q=S.q,res=search(q,S.mf);
  let h='';
  const nq=normPN(q),anyPN=nq&&S.setups.some(s=>normPN(s.pn).includes(nq));
  if(q.trim()&&!anyPN&&nq.length>=3){
    h+=`<div class="notin"><div><small class="muted">Not in the book</small><br><b>${esc(q.trim().toUpperCase())}</b></div><button class="btn go sm" data-act="newSetup" data-pn="${esc(q.trim().toUpperCase())}">Capture it</button></div>`;
  }
  h+=`<div class="reshead"><span>${q.trim()?res.length+' match'+(res.length===1?'':'es'):'Recently updated'}</span><span>${S.setups.length} setups</span></div>`;
  h+=res.slice(0,80).map(setupRow).join('');
  if(!res.length&&!q.trim())h+=`<p class="hint pad">${S.mf?'No setups on this machine yet.':'No setups yet. Tap <b>Capture</b> while a leadman sets one up.'}</p>`;
  return h;
}

  <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Part number…" value="${esc(S.q)}">

function dupWarn(s){
  if(!S.draft||!s.pn.trim())return '';
  const ex=S.setups.filter(x=>x.id!==s.id&&normPN(x.pn)===normPN(s.pn));
  if(!ex.length)return '';
  return `<div class="dup">Already in the book: ${ex.map(x=>`<b>${esc(x.op||'setup')}</b> on ${esc((machineById(x.machineId)||{}).name||'no machine')}`).join(', ')}. Keep going if this is a different operation.</div>`;
}

function toolChoices(s,key){
  const pref=key==='upper'?['Upper','Punch','Rivet set']:['Lower','Die','Anvil','Rivet set'];

    const sa=(a.machineId===s.machineId?2:0)+(pref.includes(a.kind)?1:0),sb=(b.machineId===s.machineId?2:0)+(pref.includes(b.kind)?1:0);
    return sb-sa||toolLabel(a).localeCompare(toolLabel(b));
  }).slice(0,16);

/* ============ recording ============ */
const Rec={rec:null,stream:null,chunks:[],t0:0,timer:null,cancel:false};
async function startRec(onDone){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Recording not supported here. Use "Attach audio".',3200);return}
  try{Rec.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Mic is blocked here. Use "Attach audio" instead.',3200);return}
  const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];
  const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  try{Rec.rec=new MediaRecorder(Rec.stream,mt?{mimeType:mt,audioBitsPerSecond:32000}:undefined)}catch(e){Rec.rec=new MediaRecorder(Rec.stream)}
  Rec.chunks=[];Rec.cancel=false;
  Rec.rec.ondataavailable=e=>{if(e.data&&e.data.size)Rec.chunks.push(e.data)};
  Rec.rec.onstop=async()=>{
    clearInterval(Rec.timer);Rec.stream.getTracks().forEach(t=>t.stop());
    modalLock=false;closeModal();
    if(Rec.cancel||!Rec.chunks.length)return;
    const blob=new Blob(Rec.chunks,{type:(Rec.rec.mimeType||'audio/webm').split(';')[0]});
    const id=await saveBlob(blob);onDone({id,dur:(now()-Rec.t0)/1000});
  };
  Rec.t0=now();Rec.rec.start(1000);
  openModal(`<div class="recbox"><h3><span class="recdot"></span>Recording</h3><div class="rectime" id="recT">0:00</div><div class="mbar"><button class="btn ghost" data-act="recCancel">Cancel</button><button class="btn go" data-act="recStop">Stop &amp; keep</button></div></div>`);
  modalLock=true;
  Rec.timer=setInterval(()=>{const el=$('#recT');if(el)el.textContent=fmtDur((now()-Rec.t0)/1000)},500);
}
async function audioFromFile(file){const id=await saveBlob(file);const dur=await new Promise(r=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration:0);a.onerror=()=>r(0);a.src=urlCache.get(id)});return{id,dur}}

/* ============ draft actions ============ */
function newDraft(pn='',mid=''){
  S.draft={isNew:true,step:0,stampNow:false,showPsi:false,orig:'',added:[],removed:[],data:blankSetup(pn)};
  if(mid)S.draft.data.machineId=mid;else if(S.machines.length===1)S.draft.data.machineId=S.machines[0].id;
  saveDraft();go('#edit');
}
async function pendingDraft(){
  if(!S.draft)return true;
  const d=S.draft;
  if(d.data.pn||d.data.photos.length||d.data.audio.length||!d.isNew){
    const v=await choose(`There's an unsaved setup in progress${d.data.pn?' for <b class="mono">'+esc(d.data.pn)+'</b>':''}.`,[{label:'Resume it',val:'resume',cls:'go'},{label:'Throw it away',val:'toss',cls:'danger'},{label:'Cancel',val:null,cls:'ghost'}]);
    if(v==='resume'){go('#edit');return false}
    if(v!=='toss')return false;
  }
  await discardDraft();return true;
}
async function discardDraft(){const d=S.draft;if(!d)return;for(const b of d.added||[])await delBlob(b);S.draft=null;await Store.del('meta','draft')}
async function wizSave(){
  const d=S.draft,s=d.data;
  s.pn=String(s.pn||'').trim().toUpperCase();s.rev=String(s.rev||'').trim().toUpperCase();
  if(!s.pn){d.step=0;render();toast('Part number first');return}
  s.steps=s.steps.map(x=>String(x)).filter(x=>x.trim());
  s.extraTools=s.extraTools.filter(r=>String(r.label).trim()||String(r.value).trim());
  s.settings=s.settings.filter(r=>String(r.label).trim()||String(r.value).trim());
  const changed=d.isNew||snapshot(s)!==d.orig;
  if(changed)s.updated=now();
  if(d.isNew)s.created=s.updated;
  if(d.stampNow){const by=String(d.stampBy||(leads().length===1?leads()[0]:'')).trim();if(!by){toast('Which leadman is signing it?');return}addLead(by);s.verified={by,init:initials(by),at:s.updated}}
  await Store.put('setups',s);upsert(S.setups,s);
  for(const b of d.removed||[])await delBlob(b);
  S.draft=null;clearTimeout(timers.draft);await Store.del('meta','draft');
  S.lastHash=null;swap('#setup-'+s.id);
  toast(d.isNew?'Saved to the book':'Setup updated');
}

/* ============ backup ============ */
async function buildBackup(){
  const blobs=[];for(const b of await Store.all('blobs'))blobs.push({id:b.id,type:b.type,data:await blobToB64(b.blob)});
  return {app:'blackbook',v:1,exported:new Date().toISOString(),settings:{shop:S.settings.shop,me:S.settings.me,expert:S.settings.expert},targets:S.targets,machines:S.machines,tools:S.tools,setups:S.setups,blobs};
}
async function importData(o){
  if(!o||o.app!=='blackbook')throw new Error('That is not a BLACKBOOK backup.');
  let n=0;
  for(const b of o.blobs||[])if(!(await Store.get('blobs',b.id)))await Store.put('blobs',{id:b.id,type:b.type,blob:b64ToBlob(b.data,b.type),created:now()});
  for(const k of ['machines','tools','setups'])for(const r of o[k]||[]){const ex=S[k].find(x=>x.id===r.id);if(!ex||(r.updated||0)>(ex.updated||0)){await Store.put(k,r);upsert(S[k],r);n++}}
  for(const p of o.targets||[])if(!S.targets.some(x=>normPN(x)===normPN(p)))S.targets.push(p);
  await saveTargets();
  for(const k of ['shop','me','expert'])if(!S.settings[k]&&o.settings&&o.settings[k])S.settings[k]=o.settings[k];
  saveSettings();
  return n;
}

  <div><div class="pbrand">SETUP SHEET${S.settings.shop?'<br>'+esc(S.settings.shop.toUpperCase()):''}</div><div class="pstamp">${s.verified?stampSVG(s.verified,st==='stale'):''}</div></div></div>

  ${rows('Other tooling',s.extraTools)}${rows('Settings',s.settings)}
  ${steps.length?`<div class="ph4">Steps</div><ol class="psteps">${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
  ${String(s.watch||'').trim()?`<div class="ph4">Watch out</div><div class="pwatch">${esc(s.watch)}</div>`:''}

async function printSheets(list){
  if(!list.length){toast('Nothing to print');return}
  const p=$('#print');p.innerHTML=list.map(sheetHTML).join('');
  await hydrate(p);
  await Promise.all($$('img',p).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  if(IN_FRAME)toast('Printing is blocked in this preview. It works once hosted.',3200);
  try{window.print()}catch(e){}
}

function onField(e){
  const el=e.target;
  if(el.dataset.bind&&S.draft){
    setPath(S.draft.data,el.dataset.bind,el.value);saveDraft();
    if(el.dataset.bind==='pn'){const w=$('#dupWarn');if(w)w.innerHTML=dupWarn(S.draft.data)}
    return;
  }
  if(el.dataset.set){S.settings[el.dataset.set]=el.value.trim();saveSettings();if(el.dataset.set==='shop')banners();return}
  if(el.dataset.check==='stampNow'&&S.draft){S.draft.stampNow=el.checked;saveDraft();rerender();return}
  if(el.dataset.dstamp&&S.draft){S.draft.stampBy=el.value.trim();saveDraft();return}
  if(el.dataset.qa!==undefined){const m=machineById(el.dataset.mid),x=m.qa[+el.dataset.qa];x.a=el.value;m.updated=now();saveMachineSoon(m);el.closest('.qa').classList.toggle('done',qaDone(x));return}
  if(el.id==='q'&&e.type==='input'){S.q=el.value;$('#results').innerHTML=resultsHTML();return}
  if(el.id==='cq'&&e.type==='input'){S.cq=el.value;const q=el.value.toLowerCase();$('#tagList').innerHTML=S.tools.filter(t=>!q||[t.code,t.size,t.name,t.kind,t.loc].join(' ').toLowerCase().includes(q)).sort((a,b)=>toolLabel(a).localeCompare(toolLabel(b))).map(tagHTML).join('');return}
}

document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.file){
    const files=[...(el.files||[])];if(!files.length)return;
    const kind=el.dataset.file;
    try{
      if(kind==='draftPhoto'){
        toast('Saving photo'+(files.length>1?'s':'')+'…');
        for(const f of files){const b=await compressImage(f);const id=await saveBlob(b);const d=S.draft,used=d.data.photos.map(p=>p.cap);
          d.data.photos.push({id,cap:CAPS.find(c=>!used.includes(c)&&c!=='Bad part')||'Other'});d.added.push(id)}
        saveDraft();rerender();
      }else if(kind==='machinePhoto'||kind==='toolPhoto'){
        const coll=kind==='machinePhoto'?'machines':'tools',rec=S[coll].find(x=>x.id===el.dataset.id);
        const id=await saveBlob(await compressImage(files[0]));await delBlob(rec.photo);rec.photo=id;rec.updated=now();await Store.put(coll,rec);rerender();
      }else if(kind==='draftAudio'){
        const r=await audioFromFile(files[0]);const d=S.draft;d.data.audio.push({...r,label:'Voice note '+(d.data.audio.length+1)});d.added.push(r.id);saveDraft();rerender();
      }else if(kind==='qaAudio'){
        const m=machineById(el.dataset.mid),x=m.qa[+el.dataset.qi],r=await audioFromFile(files[0]);x.audio=x.audio||[];x.audio.push({...r,label:'Answer '+(x.audio.length+1)});m.updated=now();await Store.put('machines',m);rerender();
      }else if(kind==='video'){
        const f=files[0];el.value='';if(await pendingDraft())await fromVideo(f,el.dataset.mid||'');return;
      }else if(kind==='import'){
        const n=await importData(JSON.parse(await files[0].text()));closeModal();render();toast(n+' records brought in');
      }
    }catch(err){console.error(err);toast(err.message||'Could not read that file',3200)}
    el.value='';return;
  }
  onField(e);
});

/* ============ video → setup draft (runs on the phone) ============ */
const ASR_LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6';
const ASR_MODEL='Xenova/whisper-base.en';
let asrPipe=null;
function vprog(t,p){const el=$('#vprog');if(!el)return;el.querySelector('.vt').textContent=t;const b=el.querySelector('.bar i');if(b)b.style.width=Math.max(2,Math.min(100,p||0))+'%'}
function seekTo(v,t){return new Promise(r=>{const done=()=>{v.removeEventListener('seeked',done);r()};v.addEventListener('seeked',done);v.currentTime=Math.min(Math.max(0,t),Math.max(0,v.duration-0.05));setTimeout(done,4000)})}
function grab(v,max,q){const sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);return c}
function sharp(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let s=0,s2=0,n=0;
  for(let y=1;y<h-1;y+=2)for(let x=1;x<w-1;x+=2){const g=i=>d[i]*.3+d[i+1]*.59+d[i+2]*.11,i=(y*w+x)*4;const l=4*g(i)-g(i-4)-g(i+4)-g(i-w*4)-g(i+w*4);s+=l;s2+=l*l;n++}
  return s2/n-(s/n)**2}
async function videoFrames(file,count=8){
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
  await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('This phone cannot open that video'));setTimeout(()=>rej(new Error('Video took too long to open')),20000)});
  const dur=v.duration||0,win=dur/count,picks=[];
  for(let k=0;k<count;k++){
    let best=null;
    for(let j=0;j<4;j++){const t=k*win+win*(j+.5)/4;await seekTo(v,t);const c=grab(v,240);const sc=sharp(c);if(!best||sc>best.s)best={t,s:sc}}
    vprog('Pulling photos from the video…',5+30*(k+1)/count);
    await seekTo(v,best.t);const c=grab(v,1500);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(blob)picks.push({t:best.t,blob});
  }
  URL.revokeObjectURL(v.src);return{dur,picks};
}
async function videoAudio(file){
  const buf=await file.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;let ac;
  try{ac=new AC({sampleRate:16000})}catch(e){ac=new AC()}
  const ab=await ac.decodeAudioData(buf);try{ac.close()}catch(e){}
  if(ab.sampleRate===16000)return ab.getChannelData(0);
  const off=new OfflineAudioContext(1,Math.ceil(ab.duration*16000),16000);const src=off.createBufferSource();src.buffer=ab;src.connect(off.destination);src.start();
  return (await off.startRendering()).getChannelData(0);
}
async function transcribe(pcm){
  if(!asrPipe){
    vprog('Getting the speech model (first time only, about 80 MB)…',38);
    const T=await import(ASR_LIB);
    const files={};
    const opts={dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&p.total){files[p.file]=[p.loaded,p.total];const L=Object.values(files).reduce((a,b)=>a+b[0],0),Tt=Object.values(files).reduce((a,b)=>a+b[1],0);vprog(`Getting the speech model (first time only)… ${Math.round(L/1e6)} of ${Math.round(Tt/1e6)} MB`,38+20*L/Tt)}}};
    let gpu=false;try{gpu=!!(navigator.gpu&&await navigator.gpu.requestAdapter())}catch(e){}
    if(gpu){try{asrPipe=await T.pipeline('automatic-speech-recognition',ASR_MODEL,{...opts,device:'webgpu'})}catch(e){asrPipe=null}}
    if(!asrPipe)asrPipe=await T.pipeline('automatic-speech-recognition',ASR_MODEL,{...opts,device:'wasm'});
  }
  const secs=pcm.length/16000,out=[];
  for(let a=0;a<secs;a+=28){
    vprog(`Listening… ${fmtDur(a)} of ${fmtDur(secs)}`,60+35*a/secs);
    const seg=new Float32Array(pcm.subarray(Math.floor(a*16000),Math.floor(Math.min(secs,a+28)*16000)));
    const r=await asrPipe(seg);const txt=String(r&&r.text||'').trim();
    const parts=(txt.match(/[^.?!]+[.?!]*/g)||[]).map(x=>x.trim()).filter(Boolean),L=txt.length||1;let pos=0;
    for(const tx of parts){const t=a+(seg.length/16000)*(pos/L);pos+=tx.length+1;if(!/^\[.*\]$|^\(.*\)$/.test(tx)&&(!out.length||out[out.length-1].text!==tx))out.push({t,text:tx})}
  }
  return out;
}
/* pull what we can out of the talk: numbers and shop words */
function wordNums(s){
  const W={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
  return s.replace(/\b(point|thousandths?)\b/gi,m=>/point/i.test(m)?'.':m).replace(/\b(zero|oh|one|two|three|four|five|six|seven|eight|nine)\b/gi,m=>String(W[m.toLowerCase()])).replace(/(\d)\s+(?=\d\b)/g,'$1').replace(/\.\s+(\d)/g,'.$1');
}
function parseTalk(lines){
  const all=lines.map(l=>l.text).join(' '),txt=wordNums(all),U=txt.toUpperCase();
  const f={pn:'',pns:[],op:'',psi:'',material:'',thk:'',rev:'',upper:'',lower:'',dims:[],parts:[],watch:[]};
  const pn=[...new Set((U.match(/\b\d{2,3}\s?[A-Z]\s?\d{3,5}(?:-\d+)?\b|\b[A-Z]{1,3}\d{4,}[A-Z0-9-]*\b|\b\d{5,}-\d{1,3}\b/g)||[]).map(x=>x.replace(/\s/g,'')))];
  f.parts=pn.filter(x=>/^(AN|MS|NAS|BAC|CR)/.test(x));f.pns=pn.filter(x=>!f.parts.includes(x));f.pn=f.pns[0]||'';
  let m=U.match(/\bOP(?:ERATION)?\.?\s*(?:NUMBER\s*)?(\d{2,3})\b/);if(m)f.op='Op '+m[1].padStart(3,'0');
  m=U.match(/(\d{2,3})\s*(?:PSI|P\.S\.I|POUNDS)/);if(m)f.psi=m[1];
  m=U.match(/\bAMS\s?(\d{4})/);if(m)f.material='AMS '+m[1];else{m=all.match(/\b(inconel|titanium|aluminum|aluminium|stainless|hastelloy|waspaloy)\b/i);if(m)f.material=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()}
  m=U.match(/\bREV(?:ISION)?\.?\s+([A-Z])\b/);if(m)f.rev=m[1];
  m=txt.match(/(\.\d{3})\s*(?:thick|thk)/i);if(m)f.thk=m[1];
  const tsize=re=>{for(const m of all.matchAll(re)){const a=m[0].match(/\b(flat|round|domed?|cup|\d+[\d./]*)\b/i);if(a)return a[1][0].toUpperCase()+a[1].slice(1)}return ''};
  f.upper=tsize(/\b(top|upper)\s+(punch|die|tool).{0,30}/gi);f.lower=tsize(/\b(bottom|lower)\s+(punch|die|tool).{0,30}/gi);
  for(const l of lines){
    const t=wordNums(l.text);
    const d=t.match(/(\.?\d{2,4})\s*(?:to|-|through|and)\s*(\.?\d{2,4})/i);
    if(d&&/diam|height|high|thick|flush|gap|upset|head|length|width|radius|angle/i.test(t)){
      const fix=x=>x.startsWith('.')?x:'.'+x.replace(/^0+/,'').padStart(3,'0');
      const what=(t.match(/diameter|height|thickness|flush|gap|upset|head|length|width|radius|angle/i)||['Check'])[0];
      f.dims.push({label:what[0].toUpperCase()+what.slice(1).toLowerCase(),value:fix(d[1])+'–'+fix(d[2])});
    }
    if(/\b(careful|watch|make sure|don'?t|never|if there'?s|be sure|caution|gap|hard part)\b/i.test(l.text))f.watch.push(l.text);
  }
  return f;
}
async function fromVideo(file,mid){
  openModal(`<h3>Reading the video</h3><div id="vprog"><p class="vt hint">Opening it…</p><div class="bar"><i style="width:2%"></i></div></div><p class="hint small" style="margin-top:10px">Everything happens on this phone. Nothing is sent to an AI service. Keep the screen on.</p>`);
  modalLock=true;
  try{
    const {dur,picks}=await videoFrames(file);
    vprog('Pulling the sound…',36);
    let lines=[];
    try{const pcm=await videoAudio(file);lines=await transcribe(pcm)}catch(e){console.error('ASR',e&&e.message||e);toast('Could not hear the video. Photos only.',3200)}
    vprog('Filling the sheet…',97);
    const f=parseTalk(lines);
    S.draft={isNew:true,step:0,stampNow:false,showPsi:!!f.psi,orig:'',added:[],removed:[],data:blankSetup(f.pn),fromVideo:true};
    const d=S.draft.data;
    d.machineId=mid||(S.machines.length===1?S.machines[0].id:'');
    Object.assign(d,{op:f.op,rev:f.rev,material:f.material,thk:f.thk,psi:f.psi});
    d.upper.size=f.upper;d.lower.size=f.lower;
    if(f.parts.length)d.extraTools.push({label:'Hardware',value:f.parts.join(', ')});
    d.settings=f.dims.slice(0,8);
    if(f.pns.length>1)d.settings.push({label:'Other part numbers heard',value:f.pns.slice(1,6).join(', ')});
    if(!f.pn){const nums=[...new Set((lines.map(l=>l.text).join(' ').match(/\b\d[\d-]{4,}\d\b/g)||[]))].slice(0,5);if(nums.length)d.settings.push({label:'Numbers heard (check part #)',value:nums.join(', ')})}
    d.watch=f.watch.slice(0,6).join(' ');
    d.transcript=lines;
    const caps=[];
    for(let i=0;i<picks.length;i++){const id=await saveBlob(picks[i].blob);d.photos.push({id,cap:caps[i]||'Other',t:picks[i].t});S.draft.added.push(id)}
    saveDraft();modalLock=false;closeModal();go('#edit');
    toast(lines.length?`Filled from video. ${lines.length} lines heard. Check every step.`:'Photos pulled. No talking found.',3600);
  }catch(e){console.error(e);modalLock=false;closeModal();toast(e.message||'Could not read that video',3600)}
}
function transcriptHTML(lines,edit){
  if(!lines||!lines.length)return '';
  return `<details class="talk"${edit?' open':''}><summary>What was said in the video <span class="cnt">${lines.length}</span></summary>
  ${edit?'<p class="hint">Tap + Step or + Watch to move a line onto the sheet. Fix the wording after.</p>':''}
  <div class="talk-l">${lines.map((l,i)=>`<div class="tl"><small>${fmtDur(l.t)}</small><span>${esc(l.text)}</span>${edit?`<span class="tb"><button class="btn sm" data-act="talkStep" data-i="${i}">+ Step</button><button class="btn sm" data-act="talkWatch" data-i="${i}">+ Watch</button></span>`:''}</div>`).join('')}</div></details>`;
}

/* ============ boot ============ */
(async function init(){
  await Store.init();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  await loadAll();
  await Sync.load();
  banners();
  render();
  Sync.run();
  try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{S.dl=d||null}).catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
